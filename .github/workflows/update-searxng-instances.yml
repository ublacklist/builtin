name: Update SearXNG instances

on:
  schedule:
    - cron: "0 18 * * 3"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}

jobs:
  update-searxng-instances:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      - name: pnpm update-searxng-instances
        run: pnpm update-searxng-instances

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        id: create-pull-request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "[SearXNG] Update instances"
          branch: update-searxng-instances
          sign-commits: true
          title: "[SearXNG] Update instances"

      - name: Enable auto-merge
        if: steps.create-pull-request.outputs.pull-request-number
        run: gh pr merge --squash --auto "$PULL_REQUEST_NUMBER"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
