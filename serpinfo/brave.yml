name: Brave
homepage: https://github.com/ublacklist/builtin#readme
lastModified: 2026-10-17T14:07:13Z

pages:
  - name: Default
    matches:
      - https://search.brave.com/search?*
      - https://search.brave.com/images?*
      - https://search.brave.com/news?*
      - https://search.brave.com/videos?*
      - https://safe.search.brave.com/search?*
      - https://safe.search.brave.com/images?*
      - https://safe.search.brave.com/news?*
      - https://safe.search.brave.com/videos?*
    results:
      - name: Web
        root: .snippet[data-type="web"]
        url: a
        props:
          title: .title
          $category: [const, "web"]

      - name: Web > Discussions
        root: .discussions-item > .accordion-item
        url: a
        props:
          title: .title
          $category: [const, "web"]
        button:
          - icon
          - style: "top: calc(50% - 20px); right: 32px"
          - "summary"

      - name: Web > Enrichment Cards
        root: .enrichment-card-item
        url: [attribute, href]
        props:
          title: .t-secondary
          $category: [const, "web"]

      - name: Images
        root: .image-result
        url: [domainToURL, ".image-metadata-source"]
        props:
          title: .image-metadata-title
          $category: [const, "images"]

      - name: News
        root: .snippet[data-type="news"]
        url: a
        props:
          title: .snippet-title
          $category: [const, "news"]

      - name: Videos
        root: .snippet[data-type="videos"]
        url: a
        props:
          title: .snippet-title
          $category: [const, "videos"]
    commonProps:
      $site: brave
    delay: 100
